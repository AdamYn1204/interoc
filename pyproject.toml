[project]
name = "interoc"
version = "0.1.0"
description = "Instance segmentation + keypoint localization + metric depth for 3D eye-distance measurement"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "scipy>=1.18.1",
    "torch>=2.14",
    "torchvision",
    "transformers>=5.17.0",
    "ultralytics>=8.4.150",
]

# PyPI 上的 Windows torch 只有 CPU 版，要從 PyTorch 自己的 index 拿 CUDA 版。
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
